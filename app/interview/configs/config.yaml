server:
  http:
    addr: 0.0.0.0:8004
    timeout: 3m
  grpc:
    addr: 0.0.0.0:9004
    timeout: 3m

data:
  database:
    driver: postgres
    source: "host=localhost port=5434 user=postgres password=password dbname=makejob sslmode=disable"
  redis:
    addr: localhost:6384
    password: ""
    db: 1

ai:
  service_addr: "localhost:9011"
  timeout_ms: 90000  # 并发生成全部题目时单次 LLM 调用可能 25s+，30s 会 DeadlineExceeded 致兜底

rag:
  service_addr: "localhost:9012"

archive:
  service_addr: "localhost:9010"

membership:
  service_addr: "localhost:9002"

companion:
  service_addr: "localhost:9008"  # TTS 预热：创建面试/取题时提前合成并缓存题目语音

mq:
  url: "amqp://makejob:makejob123@localhost:5672//makejob"
  exchange: "makejob.async"

jwt:
  secret: "makejob-secret-key-change-in-production"
  expire_hours: 168
  service_secret: "makejob-internal-service-secret"

code_runner:
  service_addr: "localhost:9013"
  timeout_ms: 10000

interview:
  timeout_minutes: 40

telemetry:
  otlp_endpoint: "localhost:4317"
  service_name: "makejob.interview"
  sample_ratio: 1.0
  http_port: 6064  # 本地 dev 偏移；K8s ConfigMap 覆盖为 6060
