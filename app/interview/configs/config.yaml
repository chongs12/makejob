server:
  http:
    addr: 0.0.0.0:8004
    timeout: 3m
  grpc:
    addr: 0.0.0.0:9004
    timeout: 3m

data:
  database:
    driver: postgres
    source: "host=localhost port=5434 user=postgres password=password dbname=makejob sslmode=disable"
  redis:
    addr: localhost:6384
    password: ""
    db: 1

ai:
  service_addr: "localhost:9011"
  timeout_ms: 30000

rag:
  service_addr: "localhost:9012"

archive:
  service_addr: "localhost:9010"

mq:
  url: "amqp://makejob:makejob123@localhost:5672//makejob"
  exchange: "makejob.async"

jwt:
  secret: "makejob-secret-key-change-in-production"
  expire_hours: 168
  service_secret: "makejob-internal-service-secret"

code_runner:
  service_addr: "localhost:9013"
  timeout_ms: 10000

interview:
  timeout_minutes: 40
