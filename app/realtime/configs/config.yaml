server:
  http:
    addr: 0.0.0.0:8085
    timeout: 10s
  grpc:
    addr: 0.0.0.0:9005
    timeout: 10s

data:
  database:
    driver: postgres
    source: "host=localhost port=5434 user=postgres password=password dbname=makejob sslmode=disable"
  redis:
    addr: localhost:6384
    password: ""
    db: 6

jwt:
  secret: "makejob-secret-key-change-in-production"
  expire_hours: 168
  service_secret: "makejob-internal-service-secret"

volcengine:
  app_id: "your-volcengine-app-id"
  token: "your-volcengine-token"
  ws_url: "wss://openspeech.bytedance.com/api/v3/sauc/bigmodel"

dependent_services:
  interview_addr: "localhost:9004"
  rag_addr: "localhost:9012"
