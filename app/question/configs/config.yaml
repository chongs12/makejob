server:
  http:
    addr: 0.0.0.0:8003
    timeout: 30s
  grpc:
    addr: 0.0.0.0:9003
    timeout: 2m

data:
  database:
    driver: postgres
    source: "host=localhost port=5434 user=postgres password=password dbname=makejob sslmode=disable"

ai:
  service_addr: "localhost:9011"
  coderunner_addr: "localhost:9013"
  ai_gateway_addr: "localhost:9011"
  admin_addr: "localhost:9014"

jwt:
  secret: "makejob-secret-key-change-in-production"

mq:
  url: "amqp://makejob:makejob123@localhost:5672//makejob"
  exchange: "makejob.async"

dependent_services:
  learning_archive_addr: "localhost:9010"

telemetry:
  otlp_endpoint: "localhost:4317"
  service_name: "makejob.question"
  sample_ratio: 1.0
  http_port: 6063  # 本地 dev 偏移；K8s ConfigMap 覆盖为 6060
