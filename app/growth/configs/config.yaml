server:
  http:
    addr: 0.0.0.0:8006
    timeout: 10s
  grpc:
    addr: 0.0.0.0:9006
    timeout: 10s

data:
  database:
    driver: postgres
    source: "host=localhost port=5434 user=postgres password=password dbname=makejob sslmode=disable"
  redis:
    addr: localhost:6384
    password: ""
    db: 3

jwt:
  secret: "makejob-secret-key-change-in-production"
  expire_hours: 168
  service_secret: "makejob-internal-service-secret"

dependent_services:
  question_addr: "localhost:9003"
  plan_addr: "localhost:9007"
  learning_archive_addr: "localhost:9010"
  interview_addr: "localhost:9004"

telemetry:
  otlp_endpoint: "localhost:4317"
  service_name: "makejob.growth"
  sample_ratio: 1.0
  http_port: 6066  # 本地 dev 偏移；K8s ConfigMap 覆盖为 6060
