server:
  http:
    addr: 0.0.0.0:8007
    timeout: 3m
  grpc:
    addr: 0.0.0.0:9007
    timeout: 3m

data:
  database:
    driver: postgres
    source: "host=localhost port=5434 user=postgres password=password dbname=makejob sslmode=disable"
  redis:
    addr: localhost:6384
    password: ""
    db: 4

jwt:
  secret: "makejob-secret-key-change-in-production"
  expire_hours: 168
  service_secret: "makejob-internal-service-secret"

mq:
  url: "amqp://makejob:makejob123@localhost:5672//makejob"
  exchange: "makejob.async"

ai:
  service_addr: "localhost:9011"

dependent_services:
  learning_archive_addr: "localhost:9010"

telemetry:
  otlp_endpoint: "localhost:4317"
  service_name: "makejob.plan"
  sample_ratio: 1.0
  http_port: 6067  # 本地 dev 偏移；K8s ConfigMap 覆盖为 6060
