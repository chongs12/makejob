server:
  http:
    addr: 0.0.0.0:8101
    timeout: 10s
  grpc:
    addr: 0.0.0.0:9101
    timeout: 10s

data:
  database:
    driver: postgres
    source: "host=localhost port=5434 user=postgres password=password dbname=makejob sslmode=disable"
  redis:
    addr: localhost:6384
    password: ""
    db: 2

jwt:
  secret: "makejob-secret-key-change-in-production"
  expire_hours: 168
  service_secret: "makejob-internal-service-secret"

telemetry:
  otlp_endpoint: "localhost:4317"
  service_name: "makejob.user"
  sample_ratio: 1.0
  http_port: 6061  # 本地 dev 偏移；K8s ConfigMap 覆盖为 6060
