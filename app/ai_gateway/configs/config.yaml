server:
  http:
    addr: 0.0.0.0:8011
    timeout: 3m
  grpc:
    addr: 0.0.0.0:9011
    timeout: 3m

data:
  database:
    driver: postgres
    source: "host=localhost port=5434 user=postgres password=password dbname=makejob sslmode=disable"
  redis:
    addr: localhost:6384
    password: ""
    db: 9

jwt:
  secret: "makejob-secret-key-change-in-production"
  expire_hours: 168
  service_secret: "makejob-internal-service-secret"

ark:
  api_key: "your-ark-api-key"
  base_url: "https://ark.cn-beijing.volces.com/api/v3"
  model: "your-model-endpoint-id"

fallback:
  enabled: false
  api_key: ""
  base_url: "https://api.openai.com/v1"
  model: "gpt-4o"
  timeout: 60

telemetry:
  otlp_endpoint: "localhost:4317"
  service_name: "makejob.ai_gateway"
  sample_ratio: 1.0
  http_port: 6071  # 本地 dev 偏移；K8s ConfigMap 覆盖为 6060
