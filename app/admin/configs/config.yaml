server:
  http:
    addr: 0.0.0.0:8014
    timeout: 10s
  grpc:
    addr: 0.0.0.0:9014
    timeout: 10s

data:
  database:
    driver: postgres
    source: "host=localhost port=5434 user=postgres password=password dbname=makejob sslmode=disable"
  redis:
    addr: localhost:6384
    password: ""
    db: 4

jwt:
  secret: "makejob-secret-key-change-in-production"
  expire_hours: 168
  service_secret: "makejob-internal-service-secret"

mq:
  url: "amqp://makejob:makejob123@localhost:5672//makejob"
  exchange: "makejob.async"

dependent_services:
  user_addr: "127.0.0.1:9101"
  question_addr: "127.0.0.1:9003"
  interview_addr: "127.0.0.1:9004"
  ai_gateway_addr: "127.0.0.1:9011"
  rag_addr: "127.0.0.1:9012"

telemetry:
  otlp_endpoint: "localhost:4317"
  service_name: "makejob.admin"
  sample_ratio: 1.0
  http_port: 6074  # 本地 dev 偏移；K8s ConfigMap 覆盖为 6060
