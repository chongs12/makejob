server:
  http:
    addr: 0.0.0.0:8013
    timeout: 30s
  grpc:
    # FIX: 端口对齐spec要求的9013
    addr: 0.0.0.0:9013
    timeout: 30s

data:
  database:
    driver: postgres
    source: "host=localhost port=5434 user=postgres password=password dbname=makejob sslmode=disable"
  redis:
    addr: localhost:6384
    password: ""
    db: 7

jwt:
  secret: "makejob-secret-key-change-in-production"
  expire_hours: 168
  service_secret: "makejob-internal-service-secret"

piston:
  endpoint: "http://localhost:2000"
  timeout_ms: 10000

telemetry:
  otlp_endpoint: "localhost:4317"
  service_name: "makejob.coderunner"
  sample_ratio: 1.0
  http_port: 6073  # 本地 dev 偏移；K8s ConfigMap 覆盖为 6060
