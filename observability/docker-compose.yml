services:
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: makejob-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'

  grafana:
    image: grafana/grafana:11.1.0
    container_name: makejob-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: makejob123
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    container_name: makejob-otel-collector
    restart: unless-stopped
    ports:
      - "4317:4317"   # OTLP gRPC（各服务发 trace 到此，Collector 再转发给 Jaeger）
      - "4318:4318"   # OTLP HTTP（可选）
    volumes:
      - ./otel-collector/collector.yaml:/etc/otelcol/config.yaml
    command: ["--config=/etc/otelcol/config.yaml"]
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: makejob-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"   # Jaeger UI（只暴露 UI；4317 由 Collector 走内部网络 jaeger:4317 访问）
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

volumes:
  prometheus_data:
  grafana_data:
