syntax = "proto3";
package makejob.user.v1;
option go_package = "makejob/api/makejob/user/v1;userv1";

import "google/protobuf/timestamp.proto";

service UserService {
  rpc Register(RegisterRequest) returns (AuthResponse);
  rpc Login(LoginRequest) returns (AuthResponse);
  rpc RefreshToken(RefreshTokenRequest) returns (TokenResponse);
  rpc GetProfile(UserIDRequest) returns (UserProfile);
  rpc UpdateProfile(UpdateProfileRequest) returns (UserProfile);
  rpc GetUserByID(UserIDRequest) returns (UserProfile);
  rpc BatchGetUsers(BatchGetUsersRequest) returns (BatchGetUsersResponse);
  rpc GetMembershipStatus(UserIDRequest) returns (MembershipStatus);
  rpc UpgradeMembership(UpgradeRequest) returns (MembershipStatus);
}

message UserIDRequest {
  uint64 user_id = 1;
}

message RegisterRequest {
  string username = 1;
  string email = 2;
  string password = 3;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message AuthResponse {
  string token = 1;
  string refresh_token = 2;
  int64 expires_at = 3;
  UserProfile user = 4;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message TokenResponse {
  string token = 1;
  string refresh_token = 2;
  int64 expires_at = 3;
}

message UserProfile {
  uint64 id = 1;
  string username = 2;
  string email = 3;
  string avatar = 4;
  string role = 5;
  string membership_level = 6;
  google.protobuf.Timestamp membership_expire_at = 7;
  google.protobuf.Timestamp created_at = 8;
}

message UpdateProfileRequest {
  uint64 user_id = 1;
  string username = 2;
  string avatar = 3;
}

message BatchGetUsersRequest {
  repeated uint64 ids = 1;
}

message BatchGetUsersResponse {
  repeated UserProfile users = 1;
}

message MembershipStatus {
  string level = 1;
  google.protobuf.Timestamp expire_at = 2;
  bool is_active = 3;
}

message UpgradeRequest {
  uint64 user_id = 1;
  string plan = 2;
}
