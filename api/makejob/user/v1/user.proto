syntax = "proto3";
package makejob.user.v1;
option go_package = "makejob/api/makejob/user/v1;userv1";

import "google/protobuf/timestamp.proto";
import "makejob/shared/v1/pagination.proto";

service UserService {
  rpc Register(RegisterRequest) returns (AuthResponse);
  rpc Login(LoginRequest) returns (AuthResponse);
  rpc RefreshToken(RefreshTokenRequest) returns (TokenResponse);
  rpc GetProfile(UserIDRequest) returns (UserProfile);
  rpc UpdateProfile(UpdateProfileRequest) returns (UserProfile);
  rpc GetUserByID(UserIDRequest) returns (UserProfile);
  rpc BatchGetUsers(BatchGetUsersRequest) returns (BatchGetUsersResponse);
  rpc GetMembershipStatus(UserIDRequest) returns (MembershipStatus);
  rpc UpgradeMembership(UpgradeRequest) returns (MembershipStatus);
  rpc Logout(LogoutRequest) returns (LogoutResponse);

  // --- 管理后台专用 RPC ---
  rpc AdminListUsers(AdminListUsersRequest) returns (AdminListUsersResponse);
  rpc AdminUpdateUserRole(AdminUpdateUserRoleRequest) returns (AdminUpdateUserRoleResponse);
  rpc AdminBanUser(AdminBanUserRequest) returns (AdminBanUserResponse);
  rpc GetAdminUserStats(GetAdminUserStatsRequest) returns (AdminUserStatsResponse);
}

message UserIDRequest {
  uint64 user_id = 1;
}

message RegisterRequest {
  string username = 1;
  string email = 2;
  string password = 3;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message AuthResponse {
  string token = 1;
  string refresh_token = 2;
  int64 expires_at = 3;
  UserProfile user = 4;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message TokenResponse {
  string token = 1;
  string refresh_token = 2;
  int64 expires_at = 3;
}

message UserProfile {
  uint64 id = 1;
  string username = 2;
  string email = 3;
  string avatar = 4;
  string role = 5;
  string membership_level = 6;
  google.protobuf.Timestamp membership_expire_at = 7;
  google.protobuf.Timestamp created_at = 8;
}

message UpdateProfileRequest {
  uint64 user_id = 1;
  string username = 2;
  string avatar = 3;
}

message BatchGetUsersRequest {
  repeated uint64 ids = 1;
}

message BatchGetUsersResponse {
  repeated UserProfile users = 1;
}

message MembershipStatus {
  string level = 1;
  google.protobuf.Timestamp expire_at = 2;
  bool is_active = 3;
}

message UpgradeRequest {
  uint64 user_id = 1;
  string plan = 2;
}

message LogoutRequest {
  string access_token = 1;
  string refresh_token = 2;
}

message LogoutResponse {}

message AdminListUsersRequest {
  makejob.shared.v1.PageParam page = 1;
}

message AdminListUsersResponse {
  repeated AdminUserInfo users = 1;
  makejob.shared.v1.PageResult page_result = 2;
}

message AdminUserInfo {
  uint64 id = 1;
  string username = 2;
  string email = 3;
  string role = 4;
  string avatar = 5;
  string membership_level = 6;
  string membership_type = 7;
  google.protobuf.Timestamp membership_expire_at = 8;
  bool is_disabled = 9;
  google.protobuf.Timestamp created_at = 10;
}

message AdminUpdateUserRoleRequest {
  uint64 user_id = 1;
  string role = 2;
}

message AdminUpdateUserRoleResponse {}

message AdminBanUserRequest {
  uint64 user_id = 1;
}

message AdminBanUserResponse {}

message GetAdminUserStatsRequest {}

message AdminUserStatsResponse {
  int64 total_users = 1;
  int64 pro_members = 2;
  int64 new_users_today = 3;
  int64 today_active_users = 4;
}
