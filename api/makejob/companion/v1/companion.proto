syntax = "proto3";
package makejob.companion.v1;
option go_package = "makejob/api/makejob/companion/v1;companionv1";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

service CompanionService {
  rpc Chat(CompanionChatRequest) returns (CompanionChatResponse);
  rpc Greeting(GreetingRequest) returns (CompanionChatResponse);
  rpc GetCompanionState(GetCompanionStateRequest) returns (CompanionState);
  rpc SynthesizeSpeech(SynthesizeSpeechRequest) returns (SynthesizeSpeechResponse);
  rpc RecognizeSpeech(RecognizeSpeechRequest) returns (RecognizeSpeechResponse);
  rpc ListASRConfigs(ListASRConfigsRequest) returns (ListASRConfigsResponse);
  rpc CreateASRConfig(CreateASRConfigRequest) returns (ASRConfigProto);
  rpc UpdateASRConfig(UpdateASRConfigRequest) returns (ASRConfigProto);
  rpc DeleteASRConfig(DeleteASRConfigRequest) returns (google.protobuf.Empty);
  rpc UpdateASRDefault(UpdateASRDefaultRequest) returns (google.protobuf.Empty);
}

message CompanionChatRequest {
  uint64 user_id = 1;
  string message = 2;
  string context_type = 3;
  repeated CompanionChatMessage messages = 4;
  string live2d_model_key = 5;
  CompanionChatContext context = 6;
  string conversation_state_json = 7; // JSON-serialized ConversationState from previous turn
}

message CompanionChatMessage {
  string role = 1;
  string content = 2;
}

message CompanionChatContext {
  string current_plan_title = 1;
  double current_plan_progress = 2;
  repeated string today_goals = 3;
  repeated string active_goals = 4;
  string focused_task_title = 5;
  string focused_task_description = 6;
  int32 completed_today_count = 7;
  int32 skipped_today_count = 8;
  string latest_task_action = 9;
}

message CompanionChatResponse {
  string reply = 1;
  string emotion = 2;
  repeated string suggestions = 3;
  string content = 4;
  string mood = 5;
  string action = 6;
  string audio_url = 7;
  int32 audio_duration = 8;
  string audio_format = 9;
  int32 audio_sample_rate = 10;
  Live2DDirective live2d_directive = 11;
  repeated SuggestedAction suggested_actions = 12;
  repeated InlineTrigger inline_triggers = 13;
  IntentInfo intent = 14;
  PendingAction pending_action = 15;
  ConversationState conversation_state = 16;
}

message GreetingRequest {
  uint64 user_id = 1;
  string live2d_model_key = 2;
}

// SuggestedAction 结构化引导动作，供前端渲染跳转 chip。
message SuggestedAction {
  string type = 1;    // practice | interview | adjust_plan | chat
  string target = 2;  // 题集编码 / 面试类型 / 空
  string params = 3;  // 额外参数 JSON 字符串
}

// InlineTrigger 字幕行内可点击关键词。
message InlineTrigger {
  string keyword = 1;
  string action_type = 2;
  string target = 3;
  string position_hint = 4;
}

// IntentInfo LLM 意图识别结果。
message IntentInfo {
  string type = 1;
  double confidence = 2;
  string stage = 3;
}

// PendingAction 待执行动作。
message PendingAction {
  string type = 1;
  bool ready = 2;
  map<string, string> params = 3;
  repeated string missing_info = 4;
}

// ConversationState 多轮对话状态。
message ConversationState {
  string phase = 1;
  map<string, string> collected_params = 2;
}

message Live2DDirective {
  string reply = 1;
  string emotion = 2;
  string action = 3;
  repeated Live2DDirectiveExpressionLayer expression_mix = 4;
  repeated Live2DDirectiveParameterOverride parameter_overrides = 5;
  string motion_key = 6;
  string motion_group = 7;
  string motion_priority = 8;
  int32 motion_duration_ms = 9;
  float intensity = 10;
  int32 duration_ms = 11;
  float mouth_open = 12;
  string source = 13;
}

message Live2DDirectiveExpressionLayer {
  string key = 1;
  float weight = 2;
}

message Live2DDirectiveParameterOverride {
  string id = 1;
  float value = 2;
}

message GetCompanionStateRequest {
  uint64 user_id = 1;
}

message CompanionState {
  string emotion = 1;
  string last_topic = 2;
  google.protobuf.Timestamp last_active_at = 3;
}

message SynthesizeSpeechRequest {
  string text = 1;
  string voice = 2;
}

message SynthesizeSpeechResponse {
  bytes audio_data = 1;
  string audio_url = 2;
}

// ---------- ASR 语音识别 ----------

message RecognizeSpeechRequest {
  bytes audio_data = 1;
  string format = 2;
  int32 sample_rate = 3;
  string language = 4;
}

message RecognizeSpeechResponse {
  string text = 1;
  double confidence = 2;
  double duration = 3;
}

// ---------- ASR 配置管理 ----------

message ASRConfigProto {
  uint64 id = 1;
  string name = 2;
  string engine = 3;
  string auth_config_json = 4;
  string params_json = 5;
  bool is_active = 6;
  int32 sort_order = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message ListASRConfigsRequest {}

message ListASRConfigsResponse {
  repeated ASRConfigProto configs = 1;
  uint64 default_config_id = 2;
}

message UpdateASRDefaultRequest {
  uint64 config_id = 1;
}

message CreateASRConfigRequest {
  string name = 1;
  string engine = 2;
  string auth_config_json = 3;
  string params_json = 4;
  bool is_active = 5;
  int32 sort_order = 6;
}

message UpdateASRConfigRequest {
  uint64 id = 1;
  string name = 2;
  string engine = 3;
  string auth_config_json = 4;
  string params_json = 5;
  bool is_active = 6;
  int32 sort_order = 7;
}

message DeleteASRConfigRequest {
  uint64 id = 1;
}
