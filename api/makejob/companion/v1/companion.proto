syntax = "proto3";
package makejob.companion.v1;
option go_package = "makejob/api/makejob/companion/v1;companionv1";

import "google/protobuf/timestamp.proto";

service CompanionService {
  rpc Chat(CompanionChatRequest) returns (CompanionChatResponse);
  rpc GetCompanionState(GetCompanionStateRequest) returns (CompanionState);
  rpc SynthesizeSpeech(SynthesizeSpeechRequest) returns (SynthesizeSpeechResponse);
}

message CompanionChatRequest {
  uint64 user_id = 1;
  string message = 2;
  string context_type = 3;
  repeated CompanionChatMessage messages = 4;
  string live2d_model_key = 5;
  CompanionChatContext context = 6;
}

message CompanionChatMessage {
  string role = 1;
  string content = 2;
}

message CompanionChatContext {
  string current_plan_title = 1;
  double current_plan_progress = 2;
  repeated string today_goals = 3;
  repeated string active_goals = 4;
  string focused_task_title = 5;
  string focused_task_description = 6;
  int32 completed_today_count = 7;
  int32 skipped_today_count = 8;
  string latest_task_action = 9;
}

message CompanionChatResponse {
  string reply = 1;
  string emotion = 2;
  repeated string suggestions = 3;
  string content = 4;
  string mood = 5;
  string action = 6;
  string audio_url = 7;
  int32 audio_duration = 8;
  string audio_format = 9;
  int32 audio_sample_rate = 10;
  Live2DDirective live2d_directive = 11;
}

message Live2DDirective {
  string reply = 1;
  string emotion = 2;
  string action = 3;
  repeated Live2DDirectiveExpressionLayer expression_mix = 4;
  repeated Live2DDirectiveParameterOverride parameter_overrides = 5;
  string motion_key = 6;
  string motion_group = 7;
  string motion_priority = 8;
  int32 motion_duration_ms = 9;
  float intensity = 10;
  int32 duration_ms = 11;
  float mouth_open = 12;
  string source = 13;
}

message Live2DDirectiveExpressionLayer {
  string key = 1;
  float weight = 2;
}

message Live2DDirectiveParameterOverride {
  string id = 1;
  float value = 2;
}

message GetCompanionStateRequest {
  uint64 user_id = 1;
}

message CompanionState {
  string emotion = 1;
  string last_topic = 2;
  google.protobuf.Timestamp last_active_at = 3;
}

message SynthesizeSpeechRequest {
  string text = 1;
  string voice = 2;
}

message SynthesizeSpeechResponse {
  bytes audio_data = 1;
  string audio_url = 2;
}
