syntax = "proto3";
package makejob.community.v1;
option go_package = "makejob/api/makejob/community/v1;communityv1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";
import "makejob/shared/v1/pagination.proto";

service CommunityService {
  rpc ListPosts(ListPostsRequest) returns (ListPostsResponse);
  rpc GetPost(GetPostRequest) returns (PostDetail);
  rpc CreatePost(CreatePostRequest) returns (Post);
  rpc UpdatePost(UpdatePostRequest) returns (Post);
  rpc DeletePost(DeletePostRequest) returns (google.protobuf.Empty);
  rpc ListComments(ListCommentsRequest) returns (ListCommentsResponse);
  rpc CreateComment(CreateCommentRequest) returns (Comment);
  rpc ToggleLike(ToggleLikeRequest) returns (LikeResponse);
  rpc ListMyPosts(ListMyPostsRequest) returns (ListMyPostsResponse);
}

message ListPostsRequest {
  makejob.shared.v1.PageParam page = 1;
  string category = 2;
  string post_type = 3;  // FIX B5: discussion/article/question
  string keyword = 4;    // FIX B5: 搜索标题/内容
  string tag = 5;        // FIX B5: 标签过滤
  string sort_by = 6;    // FIX B5: latest/popular/most_liked
}

message ListPostsResponse {
  repeated PostSummary posts = 1;
  makejob.shared.v1.PageResult page_result = 2;
}

message PostSummary {
  uint64 id = 1;
  string title = 2;
  string category = 3;
  uint64 author_id = 4;
  string author_name = 5;
  int32 like_count = 6;
  int32 comment_count = 7;
  google.protobuf.Timestamp created_at = 8;
  // 对齐前端 CommunityPostItem
  string post_type = 9;
  string summary = 10;
  string tags = 11;
  int32 view_count = 12;
  string author_avatar = 13;
  google.protobuf.Timestamp updated_at = 14;
  bool is_author = 15;
  bool is_liked = 16;
  bool is_pinned = 17;
  bool is_recommended = 18;
}

message GetPostRequest {
  uint64 id = 1;
}

message PostDetail {
  uint64 id = 1;
  string title = 2;
  string content = 3;
  string category = 4;
  uint64 author_id = 5;
  string author_name = 6;
  string author_avatar = 7;
  int32 like_count = 8;
  int32 comment_count = 9;
  bool is_liked = 10;
  google.protobuf.Timestamp created_at = 11;
  int32 view_count = 12; // FIX B5: 浏览量字段
  // 对齐前端 CommunityPostItem
  string post_type = 13;
  string summary = 14;
  string tags = 15;
  google.protobuf.Timestamp updated_at = 16;
  bool is_author = 17;
  bool is_pinned = 18;
  bool is_recommended = 19;
}

message CreatePostRequest {
  uint64 author_id = 1;
  string title = 2;
  string content = 3;
  string category = 4;
  string post_type = 5; // FIX B5: discussion/article/question
  string tags = 6;      // FIX B5: 逗号分隔的标签
}

message Post {
  uint64 id = 1;
  string title = 2;
  google.protobuf.Timestamp created_at = 3;
}

message UpdatePostRequest {
  uint64 id = 1;
  uint64 author_id = 2;
  string title = 3;
  string content = 4;
  string tags = 5;
}

message DeletePostRequest {
  uint64 id = 1;
  uint64 author_id = 2;
}

message ListCommentsRequest {
  uint64 post_id = 1;
  makejob.shared.v1.PageParam page = 2;
}

message ListCommentsResponse {
  repeated Comment comments = 1;
  makejob.shared.v1.PageResult page_result = 2;
}

message Comment {
  uint64 id = 1;
  uint64 post_id = 2;
  uint64 author_id = 3;
  string author_name = 4;
  string content = 5;
  google.protobuf.Timestamp created_at = 6;
  // 对齐前端 CommunityCommentItem
  string author_avatar = 7;
  google.protobuf.Timestamp updated_at = 8;
  bool is_author = 9;
}

message CreateCommentRequest {
  uint64 post_id = 1;
  uint64 author_id = 2;
  string content = 3;
}

message ToggleLikeRequest {
  uint64 user_id = 1;
  uint64 post_id = 2;
}

message LikeResponse {
  bool liked = 1;
  int32 like_count = 2;
}

message ListMyPostsRequest {
  uint64 author_id = 1;
  makejob.shared.v1.PageParam page = 2;
}

message ListMyPostsResponse {
  repeated PostSummary posts = 1;
  makejob.shared.v1.PageResult page_result = 2;
}
