syntax = "proto3";
package makejob.question.v1;
option go_package = "makejob/api/makejob/question/v1;questionv1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";
import "makejob/shared/v1/pagination.proto";

service QuestionService {
  // --- 题库浏览 ---
  rpc ListQuestions(ListQuestionsRequest) returns (ListQuestionsResponse);
  rpc GetQuestion(GetQuestionRequest) returns (QuestionDetail);
  rpc ListCategories(ListCategoriesRequest) returns (CategoryTreeResponse);
  rpc ListIndustries(google.protobuf.Empty) returns (IndustryListResponse);

  // --- 刷题交互 ---
  rpc SubmitAnswer(SubmitAnswerRequest) returns (SubmitAnswerResponse);
  rpc RunCode(RunCodeRequest) returns (RunCodeResponse);

  // --- 收藏/笔记 ---
  rpc CreateFavorite(CreateFavoriteRequest) returns (FavoriteResponse);
  rpc DeleteFavorite(DeleteFavoriteRequest) returns (FavoriteResponse);
  rpc ListFavorites(ListFavoritesRequest) returns (FavoriteListResponse);
  rpc CreateNote(CreateNoteRequest) returns (NoteResponse);
  rpc UpdateNote(UpdateNoteRequest) returns (NoteResponse);
  rpc ListNotes(ListNotesRequest) returns (NoteListResponse);

  // --- 智能推荐 ---
  rpc GetPracticeRecommendations(PracticeRecommendationRequest) returns (PracticeRecommendationResponse);
  rpc GetWrongQuestions(WrongQuestionRequest) returns (WrongQuestionListResponse);
  rpc GetUserPracticeStats(UserIDRequest) returns (UserPracticeStats);

  // --- 模拟考试 ---
  rpc GetRandomExam(RandomExamRequest) returns (ExamResponse);
  rpc GenerateTimedExam(GenerateTimedExamRequest) returns (GenerateTimedExamResponse);
  rpc SubmitExam(SubmitExamRequest) returns (SubmitExamResponse);

  // --- 笔记删除 ---
  rpc DeleteNote(DeleteNoteRequest) returns (google.protobuf.Empty);

  // --- 题目集 ---
  rpc ListQuestionSets(ListQuestionSetsRequest) returns (ListQuestionSetsResponse);
  rpc GetQuestionSetDetail(GetQuestionSetDetailRequest) returns (QuestionSetDetail);

  // --- 错题主题 ---
  rpc ListMistakeTopics(ListMistakeTopicsRequest) returns (ListMistakeTopicsResponse);
  rpc GetMistakeTopic(GetMistakeTopicRequest) returns (MistakeTopicCard);

  // --- 管理后台专用 RPC ---
  rpc AdminListQuestions(AdminListQuestionsRequest) returns (AdminListQuestionsResponse);
  rpc AdminCreateQuestion(AdminCreateQuestionRequest) returns (AdminCreateQuestionResponse);
  rpc AdminUpdateQuestion(AdminUpdateQuestionRequest) returns (AdminUpdateQuestionResponse);
  rpc AdminDeleteQuestion(AdminDeleteQuestionRequest) returns (AdminDeleteQuestionResponse);
  rpc GetAdminQuestionStats(GetAdminQuestionStatsRequest) returns (AdminQuestionStatsResponse);

  // --- 管理后台题单 CRUD ---
  rpc AdminCreateQuestionSet(AdminCreateQuestionSetRequest) returns (AdminCreateQuestionSetResponse);
  rpc AdminUpdateQuestionSet(AdminUpdateQuestionSetRequest) returns (AdminUpdateQuestionSetResponse);
  rpc AdminDeleteQuestionSet(AdminDeleteQuestionSetRequest) returns (AdminDeleteQuestionSetResponse);
  rpc AdminListQuestionSets(AdminListQuestionSetsRequest) returns (AdminListQuestionSetsResponse);
  rpc AdminGetQuestionSet(AdminGetQuestionSetRequest) returns (AdminQuestionSetDetail);
  rpc AdminAddQuestionsToSet(AdminAddQuestionsToSetRequest) returns (AdminAddQuestionsToSetResponse);
  rpc AdminRemoveQuestionsFromSet(AdminRemoveQuestionsFromSetRequest) returns (AdminRemoveQuestionsFromSetResponse);
}

// === 题库浏览 ===

message UserIDRequest {
  uint64 user_id = 1;
}

message ListQuestionsRequest {
  string industry_code = 1;
  uint64 category_id = 2;
  string difficulty = 3;
  string keyword = 4;
  makejob.shared.v1.PageParam page = 5;
}

message ListQuestionsResponse {
  repeated QuestionSummary questions = 1;
  makejob.shared.v1.PageResult page_result = 2;
}

message QuestionSummary {
  uint64 id = 1;
  string title = 2;
  string difficulty = 3;
  string type = 4;
  string industry_code = 5;
  string category_name = 6;
  uint64 category_id = 7;
  uint64 industry_id = 8;
  repeated string tags = 9;
  bool is_answered = 10;
}

message GetQuestionRequest {
  uint64 id = 1;
}

message QuestionDetail {
  uint64 id = 1;
  string title = 2;
  string content = 3;
  string difficulty = 4;
  string type = 5;
  string industry_code = 6;
  CategoryInfo category = 7;
  repeated string tags = 8;
  string starter_code = 9;
  string language = 10;
  string evaluation_mode = 11;
  repeated TestCase test_cases = 12;
  string reference_answer = 13;
  string explanation = 14;
  bool is_favorited = 15;
  google.protobuf.Timestamp created_at = 16;
  // 结构化 JSON 字段，由网关解析为前端期望的对象/数组
  string options_json = 17;
  string answer = 18;
  string solution_json = 19;
  string judge_config_json = 20;
  string answer_template_json = 21;
  NoteResponse user_note = 22;
  bool is_answered = 23;
}

message TestCase {
  string input = 1;
  string expected_output = 2;
  bool is_hidden = 3;
}

message CategoryInfo {
  uint64 id = 1;
  string name = 2;
  uint64 parent_id = 3;
}

message ListCategoriesRequest {
  string industry_code = 1;
}

message CategoryTreeResponse {
  repeated CategoryNode categories = 1;
}

message CategoryNode {
  uint64 id = 1;
  string name = 2;
  repeated CategoryNode children = 3;
  int32 question_count = 4;
}

message IndustryListResponse {
  repeated IndustryInfo industries = 1;
}

message IndustryInfo {
  uint64 id = 1;
  string code = 2;
  string name = 3;
  string icon = 4;
}

// === 刷题交互 ===

message SubmitAnswerRequest {
  uint64 question_id = 1;
  uint64 user_id = 2;
  string answer = 3;
  string language = 4;
}

message SubmitAnswerResponse {
  bool is_correct = 1;
  double score = 2;
  string feedback = 3;
  string correct_answer = 4;
  string explanation = 5;
  repeated string key_points = 6;
  string evaluation_mode = 7;
  JudgeSummary judge_summary = 8;
}

message JudgeSummary {
  bool all_passed = 1;
  int32 total_cases = 2;
  int32 passed_cases = 3;
  repeated JudgeCaseResult results = 4;
}

message JudgeCaseResult {
  string input = 1;
  string expected_output = 2;
  string actual_output = 3;
  bool passed = 4;
  string description = 5;
}

message RunCodeRequest {
  uint64 question_id = 1;
  string language = 2;
  string code = 3;
}

message RunCodeResponse {
  bool success = 1;
  string output = 2;
  string error = 3;
  int32 test_cases_passed = 4;
  int32 total_test_cases = 5;
  int64 execution_time_ms = 6;
}

// === 收藏/笔记 ===

message CreateFavoriteRequest {
  uint64 user_id = 1;
  uint64 question_id = 2;
}

message DeleteFavoriteRequest {
  uint64 user_id = 1;
  uint64 question_id = 2;
}

message ListFavoritesRequest {
  uint64 user_id = 1;
  makejob.shared.v1.PageParam page = 2;
}

message FavoriteResponse {
  bool is_favorited = 1;
}

message FavoriteListResponse {
  repeated QuestionSummary questions = 1;
  makejob.shared.v1.PageResult page_result = 2;
}

message CreateNoteRequest {
  uint64 user_id = 1;
  uint64 question_id = 2;
  string content = 3;
}

message NoteResponse {
  uint64 id = 1;
  uint64 question_id = 2;
  string content = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message UpdateNoteRequest {
  uint64 id = 1;
  uint64 user_id = 2;
  string content = 3;
}

message ListNotesRequest {
  uint64 user_id = 1;
  uint64 question_id = 2;
  makejob.shared.v1.PageParam page = 3;
}

message NoteListResponse {
  repeated NoteResponse notes = 1;
  makejob.shared.v1.PageResult page_result = 2;
}

// === 智能推荐 ===

// FIX Q4: 新增请求类型，支持 interview_id 面试驱动推荐
message PracticeRecommendationRequest {
  uint64 user_id = 1;
  uint64 interview_id = 2;  // 可选，>0 时启用面试驱动推荐
}

message PracticeRecommendationResponse {
  repeated RecommendedQuestion questions = 1;
  string reason = 2;
  repeated string focus_tags = 3;
}

message RecommendedQuestion {
  uint64 question_id = 1;
  string title = 2;
  string difficulty = 3;
  double relevance_score = 4;
  string recommend_reason = 5;
  // 对齐前端 PracticeRecommendationItem.question 所需字段
  string type = 6;
  uint64 category_id = 7;
  uint64 industry_id = 8;
  string category_name = 9;
  string tags = 10;
  // 对齐前端 PracticeRecommendationItem 项级字段
  string focus_tag = 11;
  string topic_code = 12;
  string topic_title = 13;
  string topic_problem_pattern = 14;
  repeated string related_question_sets = 15;
  repeated string recommended_actions = 16;
  string primary_question_set = 17;
  string dominant_archive_phase = 18;
  string dominant_archive_phase_label = 19;
  string recommendation_mode = 20;
  string source_type = 21;
  int32 priority = 22;
  int32 occurrence_count = 23;
  string priority_explanation = 24;
}

message WrongQuestionRequest {
  uint64 user_id = 1;
  string industry_code = 2;
  makejob.shared.v1.PageParam page = 3;
}

message WrongQuestionListResponse {
  repeated WrongQuestionEntry entries = 1;
  makejob.shared.v1.PageResult page_result = 2;
}

message WrongQuestionEntry {
  uint64 question_id = 1;
  string title = 2;
  int32 wrong_count = 3;
  google.protobuf.Timestamp last_wrong_at = 4;
  string last_answer = 5;
}

message UserPracticeStats {
  int32 total_answered = 1;
  int32 total_correct = 2;
  double accuracy = 3;
  repeated CategoryStat category_stats = 4;
  int32 streak_days = 5;
  // 对齐前端 PracticeStats 接口
  int32 correct_count = 6;
  int32 wrong_count = 7;
  double accuracy_rate = 8;
  int32 today_count = 9;
}

message CategoryStat {
  string category_name = 1;
  int32 answered = 2;
  int32 correct = 3;
  double accuracy = 4;
}

// === 模拟考试 ===

message RandomExamRequest {
  uint64 user_id = 1;
  string industry_code = 2;
  int32 question_count = 3;
  repeated string categories = 4;
  uint64 industry_id = 5;
  uint64 category_id = 6;
  string difficulty = 7;
}

message ExamResponse {
  repeated QuestionDetail questions = 1;
  int32 time_limit_minutes = 2;
  uint64 exam_id = 3;
}

// === 限时考试 ===

message GenerateTimedExamRequest {
  uint64 user_id = 1;
  string industry_code = 2;
  int32 question_count = 3;
  int32 time_limit_minutes = 4;
  uint64 industry_id = 5;
  uint64 category_id = 6;
  string difficulty = 7;
}

message GenerateTimedExamResponse {
  uint64 exam_id = 1;
  repeated QuestionDetail questions = 2;
  int32 time_limit_minutes = 3;
  google.protobuf.Timestamp started_at = 4;
  google.protobuf.Timestamp expires_at = 5;
}

message SubmitExamRequest {
  uint64 exam_id = 1;
  uint64 user_id = 2;
  map<uint64, string> answers = 3;
}

message SubmitExamResponse {
  uint64 exam_id = 1;
  double total_score = 2;
  int32 correct_count = 3;
  int32 total_count = 4;
  repeated QuestionResult question_results = 5;
}

message QuestionResult {
  uint64 question_id = 1;
  bool is_correct = 2;
  double score = 3;
  string feedback = 4;
  repeated string mistake_tags = 5;
}

// === 笔记删除 ===

message DeleteNoteRequest {
  uint64 note_id = 1;
  uint64 user_id = 2;
}

// === 题目集 ===

message ListQuestionSetsRequest {
  string industry_code = 1;
  makejob.shared.v1.PageParam page = 2;
}

message ListQuestionSetsResponse {
  repeated QuestionSetSummary items = 1;
  makejob.shared.v1.PageResult page_result = 2;
}

message QuestionSetPreview {
  uint64 id = 1;
  string title = 2;
  string type = 3;
  string difficulty = 4;
}

message QuestionSetSummary {
  uint64 id = 1;
  string title = 2;
  string description = 3;
  int32 question_count = 4;
  string difficulty = 5;
  // 对齐前端 PracticeQuestionSetSummary
  string slug = 6;
  repeated string focus_tags = 7;
  repeated QuestionSetPreview questions = 8;
}

message GetQuestionSetDetailRequest {
  uint64 set_id = 1;
}

message QuestionSetDetail {
  QuestionSetSummary info = 1;
  repeated QuestionSummary questions = 2;
}

// === 错题主题 ===

message ListMistakeTopicsRequest {
  uint64 user_id = 1;
  int32 limit = 2;
}

message ListMistakeTopicsResponse {
  repeated MistakeTopic topics = 1;
}

message MistakeTopic {
  string topic = 1;
  int32 error_count = 2;
  int32 total_attempts = 3;
  double error_rate = 4;
  repeated MistakeQuestion recent_wrong_questions = 5;
}

message MistakeQuestion {
  uint64 question_id = 1;
  string title = 2;
  string difficulty = 3;
  google.protobuf.Timestamp last_wrong_at = 4;
}

message GetMistakeTopicRequest {
  string code = 1;
}

message MistakeTopicCard {
  string code = 1;
  string tag = 2;
  string title = 3;
  string problem_pattern = 4;
  repeated string root_causes = 5;
  repeated string self_check_list = 6;
  repeated string practice_directions = 7;
  repeated string recommended_actions = 8;
  repeated string related_question_sets = 9;
}

// === 管理后台专用 ===

message AdminListQuestionsRequest {
  makejob.shared.v1.PageParam page = 1;
  string keyword = 2;
  string difficulty = 3;
}

message AdminListQuestionsResponse {
  repeated AdminQuestionInfo questions = 1;
  makejob.shared.v1.PageResult page_result = 2;
}

message AdminQuestionInfo {
  uint64 id = 1;
  uint64 category_id = 2;
  uint64 industry_id = 3;
  string type = 4;
  string difficulty = 5;
  string title = 6;
  string content = 7;
  string options_json = 8;
  string answer = 9;
  string explanation = 10;
  string solution_json = 11;
  string judge_config_json = 12;
  string answer_template_json = 13;
  string tags = 14;
  bool is_active = 15;
  google.protobuf.Timestamp created_at = 16;
  google.protobuf.Timestamp updated_at = 17;
  string category_name = 18;
  string industry_name = 19;
}

message AdminCreateQuestionRequest {
  uint64 category_id = 1;
  uint64 industry_id = 2;
  string type = 3;
  string difficulty = 4;
  string title = 5;
  string content = 6;
  string options_json = 7;
  string answer = 8;
  string explanation = 9;
  string solution_json = 10;
  string judge_config_json = 11;
  string answer_template_json = 12;
  string tags = 13;
  bool is_active = 14;
}

message AdminCreateQuestionResponse {
  uint64 id = 1;
}

message AdminUpdateQuestionRequest {
  uint64 id = 1;
  uint64 category_id = 2;
  uint64 industry_id = 3;
  string type = 4;
  string difficulty = 5;
  string title = 6;
  string content = 7;
  string options_json = 8;
  string answer = 9;
  string explanation = 10;
  string solution_json = 11;
  string judge_config_json = 12;
  string answer_template_json = 13;
  string tags = 14;
  optional bool is_active = 15;
}

message AdminUpdateQuestionResponse {}

message AdminDeleteQuestionRequest {
  uint64 id = 1;
}

message AdminDeleteQuestionResponse {}

message GetAdminQuestionStatsRequest {}

message AdminQuestionStatsResponse {
  int64 total_questions = 1;
}

// === 管理后台题单 CRUD ===

message AdminCreateQuestionSetRequest {
  string name = 1;
  string description = 2;
  string industry_code = 3;
  string cover_image = 4;
}

message AdminCreateQuestionSetResponse {
  uint64 id = 1;
}

message AdminUpdateQuestionSetRequest {
  uint64 id = 1;
  string name = 2;
  string description = 3;
  string industry_code = 4;
  string cover_image = 5;
}

message AdminUpdateQuestionSetResponse {}

message AdminDeleteQuestionSetRequest {
  uint64 id = 1;
}

message AdminDeleteQuestionSetResponse {}

message AdminListQuestionSetsRequest {
  string industry_code = 1;
  makejob.shared.v1.PageParam page = 2;
}

message AdminListQuestionSetsResponse {
  repeated AdminQuestionSetInfo items = 1;
  makejob.shared.v1.PageResult page_result = 2;
}

message AdminQuestionSetInfo {
  uint64 id = 1;
  string name = 2;
  string description = 3;
  string industry_code = 4;
  string cover_image = 5;
  int32 question_count = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message AdminGetQuestionSetRequest {
  uint64 id = 1;
}

message AdminQuestionSetDetail {
  AdminQuestionSetInfo info = 1;
  repeated AdminQuestionSetItem questions = 2;
}

message AdminQuestionSetItem {
  uint64 question_id = 1;
  string title = 2;
  string difficulty = 3;
  string type = 4;
  int32 sort_order = 5;
}

message AdminAddQuestionsToSetRequest {
  uint64 set_id = 1;
  repeated uint64 question_ids = 2;
}

message AdminAddQuestionsToSetResponse {
  int32 added_count = 1;
}

message AdminRemoveQuestionsFromSetRequest {
  uint64 set_id = 1;
  repeated uint64 question_ids = 2;
}

message AdminRemoveQuestionsFromSetResponse {
  int32 removed_count = 1;
}
