syntax = "proto3";
package makejob.ai.v1;
option go_package = "makejob/api/makejob/ai/v1;aiv1";

import "google/protobuf/struct.proto";

service AIService {
  rpc InterviewAgent(InterviewAgentRequest) returns (InterviewAgentResponse);
  rpc PlanAgent(PlanAgentRequest) returns (PlanAgentResponse);
  rpc CompanionAgent(CompanionAgentRequest) returns (CompanionAgentResponse);
  rpc QuizAnalyzer(QuizAnalyzerRequest) returns (QuizAnalyzerResponse);
  rpc AnalyzeCode(AnalyzeCodeRequest) returns (AnalyzeCodeResponse);
  rpc DiagnoseInterviewCoding(DiagnoseInterviewCodingRequest) returns (DiagnoseInterviewCodingResponse);
  rpc ExplainAnswer(ExplainAnswerRequest) returns (ExplainAnswerResponse);
  rpc GenerateHint(GenerateHintRequest) returns (GenerateHintResponse);
  rpc ResumeParser(ResumeParserRequest) returns (ResumeParserResponse);
  rpc Live2DDirector(Live2DDirectiveRequest) returns (Live2DDirectiveResponse);

  // === Interview 会话式 RPC（对齐单体 InterviewAgent 接口）===
  rpc StartInterview(StartInterviewRequest) returns (StartInterviewResponse);
  rpc EvaluateAnswer(EvaluateAnswerRequest) returns (EvaluateAnswerResponse);
  rpc GetNextQuestionSession(GetNextQuestionSessionRequest) returns (GetNextQuestionSessionResponse);
  rpc GenerateInterviewReport(GenerateInterviewReportRequest) returns (GenerateInterviewReportResponse);
  rpc EndInterviewSession(EndInterviewSessionRequest) returns (EndInterviewSessionResponse);
  rpc GenerateReportFromHistory(GenerateReportFromHistoryRequest) returns (GenerateInterviewReportResponse);
  rpc GenerateKnowledgeReport(GenerateKnowledgeReportRequest) returns (GenerateKnowledgeReportResponse);
  rpc GenerateJobReport(GenerateJobReportRequest) returns (GenerateJobReportResponse);
  // 标准语音面试：单次 LLM 调用一次性生成全部题目（全局编排去重）
  rpc GenerateInterviewQuestions(GenerateInterviewQuestionsRequest) returns (GenerateInterviewQuestionsResponse);

  // === Plan 扩展 RPC（对齐单体 PlanAgent 接口）===
  rpc AdjustPlan(AdjustPlanRequest) returns (AdjustPlanResponse);
  rpc GetStudySuggestion(GetStudySuggestionRequest) returns (GetStudySuggestionResponse);

  // === Companion 扩展 RPC（对齐单体 GetGreeting/GetEncouragement）===
  rpc GetGreeting(GetGreetingRequest) returns (GetGreetingResponse);
  rpc GetEncouragement(GetEncouragementRequest) returns (GetEncouragementResponse);

  // === Admin 调试 RPC ===
  rpc RenderPrompt(RenderPromptRequest) returns (RenderPromptResponse);
  rpc DebugAI(DebugAIRequest) returns (DebugAIResponse);
  rpc GenerateQuestionCandidates(GenerateQuestionCandidatesRequest) returns (GenerateQuestionCandidatesResponse);

  // === 题目流水线流式生成 ===
  rpc GenerateQuestionCandidatesStream(GenerateQuestionCandidatesRequest) returns (stream QuestionPipelineStreamEvent);
}

message InterviewAgentRequest {
  uint64 interview_id = 1;
  string industry_code = 2;
  string difficulty = 3;
  repeated Message history = 4;
  string user_answer = 5;
  int32 question_index = 6;
  string resume_text = 7;
  string job_description = 8;
  repeated string topics = 9;  // 知识点专项面试的自定义知识点列表
  string interview_type = 10;  // knowledge | job，决定出题 prompt 分支
}

message Message {
  string role = 1;
  string content = 2;
}

message InterviewAgentResponse {
  string question = 1;
  string topic = 2;
  string difficulty = 3;
  string type = 4;
  string hints = 5;
  string feedback = 6;
  double score = 7;
  bool should_end = 8;
  string live2d_emotion = 9;
  string live2d_action = 10;
}

// GenerateInterviewQuestionsRequest 标准语音面试单次全局批量出题请求
message GenerateInterviewQuestionsRequest {
  string industry_code = 1;
  string difficulty = 2;
  string resume_text = 3;
  string job_description = 4;
  repeated string topics = 5;   // 知识点专项面试的自定义知识点
  string interview_type = 6;    // knowledge | job，决定出题 prompt 分支
  int32 question_count = 7;     // 需要一次性生成的题目总数
}

// GenerateInterviewQuestionsResponse 批量出题响应，一次性返回全部题目
message GenerateInterviewQuestionsResponse {
  repeated InterviewAgentResponse questions = 1;  // 复用单题结构
}

// ============================================================
// Interview 会话式 RPC 消息（对齐单体 InterviewAgent 接口）
// ============================================================

message StartInterviewRequest {
  uint64 interview_id = 1;
  string industry_code = 2;
  string difficulty = 3;
  int32 question_count = 4;
  string resume_text = 5;
  string job_description = 6;
  string interview_mode = 7;
  repeated string topics = 8;  // 知识点专项面试的自定义知识点列表
  string interview_type = 9;  // knowledge | job，决定出题 prompt 分支
}

message StartInterviewResponse {
  string session_id = 1;
  string question = 2;
  string topic = 3;
  string difficulty = 4;
  string type = 5;
  string hints = 6;
  Live2DDirective live2d_directive = 7;
}

message EvaluateAnswerRequest {
  string session_id = 1;
  int32 question_index = 2;
  string answer = 3;
  string rag_context = 4;  // RAG 检索到的参考知识，注入到评分 prompt
}

message EvaluateAnswerResponse {
  double score = 1;
  bool is_correct = 2;
  string feedback = 3;
  repeated string key_points = 4;
  string suggestions = 5;
  string follow_up = 6;
}

message GetNextQuestionSessionRequest {
  string session_id = 1;
  string rag_context = 2;  // RAG 检索到的参考知识，注入到出题 prompt
}

message GetNextQuestionSessionResponse {
  string question = 1;
  string topic = 2;
  string difficulty = 3;
  string type = 4;
  string hints = 5;
  bool has_next = 6;
  Live2DDirective live2d_directive = 7;
}

message GenerateInterviewReportRequest {
  string session_id = 1;
}

message GenerateInterviewReportResponse {
  double overall_score = 1;
  string summary = 2;
  map<string, double> dimension_scores = 3;
  repeated string strengths = 4;
  repeated string weaknesses = 5;
  repeated string suggestions = 6;
  string ai_feedback = 7;
}

message EndInterviewSessionRequest {
  string session_id = 1;
}

message EndInterviewSessionResponse {
  bool success = 1;
}

message HistoryMessage {
  string role = 1;
  string content = 2;
}

message GenerateReportFromHistoryRequest {
  repeated HistoryMessage history = 1;
  string industry_code = 2;
  string difficulty = 3;
  int32 total_questions = 4;
}

// GenerateKnowledgeReportRequest 知识点专项面试报告生成请求（不依赖 session，基于完整对话历史）
message GenerateKnowledgeReportRequest {
  repeated HistoryMessage history = 1;
  repeated string knowledge_topics = 2;  // 用户自定义知识点列表
  string difficulty = 3;
  int32 total_questions = 4;
}

// GenerateKnowledgeReportResponse 知识点专项面试报告生成响应
message GenerateKnowledgeReportResponse {
  string report_json = 1;   // 完整结构化报告 JSON，前端按 knowledge 模板渲染
  double overall_score = 2;  // 总分，便于落库顶层字段
  string rating = 3;         // 评级：优秀/良好/合格/薄弱
}

// GenerateJobReportRequest 岗位求职面试报告生成请求（基于完整对话历史 + 简历画像 + JD）
message GenerateJobReportRequest {
  repeated HistoryMessage history = 1;
  string resume_text = 2;          // 简历原文
  string resume_parsed_json = 3;   // 简历解析画像 JSON（skills/projects/weak_signals 等）
  string job_description = 4;      // 目标岗位 JD
  string industry_code = 5;
  string difficulty = 6;
  int32 total_questions = 7;
}

// GenerateJobReportResponse 岗位求职面试报告生成响应
message GenerateJobReportResponse {
  string report_json = 1;          // 完整结构化报告 JSON，前端按 job 模板渲染
  double overall_score = 2;        // 总分（后端加权算，覆盖 LLM）
  string rating = 3;               // 评级：优秀/良好/合格/薄弱
  string hire_recommendation = 4;  // 录用建议：建议录用/建议复试考察/人才储备/不予录用
}

message PlanAgentRequest {
  uint64 user_id = 1;
  string industry_code = 2;
  string goal = 3;
  int32 daily_hours = 4;
  repeated string weak_topics = 5;
  repeated string recent_activities = 6;
}

message PlanAgentResponse {
  string plan_title = 1;
  repeated PlanTask tasks = 2;
  string summary = 3;
}

// AdjustPlan 学习计划调整请求（对齐单体 PlanAgent.AdjustPlan）
message AdjustPlanRequest {
  uint64 user_id = 1;
  string plan_id = 2;
  repeated string completed_tasks = 3;
  map<string, double> performance = 4;
  string current_phase = 5;
  repeated string weak_topics = 6;
  string goal_description = 7;
  string industry_code = 8;
  int32 daily_hours = 9;
}

// AdjustPlan 学习计划调整响应
message AdjustPlanResponse {
  string plan_title = 1;
  repeated PlanTask tasks = 2;
  string summary = 3;
  string phase = 4;
  string phase_goal = 5;
  int32 duration_days = 6;
}

// GetStudySuggestion 学习建议请求（对齐单体 PlanAgent.GetStudySuggestion）
message GetStudySuggestionRequest {
  uint64 user_id = 1;
  string level = 2;               // beginner/intermediate/advanced
  int32 daily_hours = 3;
  int32 duration_days = 4;
  string goal_description = 5;
  repeated string weak_topics = 6;
  repeated string strong_topics = 7;
  string industry_code = 8;
}

// GetStudySuggestion 学习建议响应
message GetStudySuggestionResponse {
  string suggestion = 1;          // Markdown 格式的学习建议
}

message PlanTask {
  string title = 1;
  string description = 2;
  string phase = 3;
  int32 order_index = 4;
  int32 estimated_hours = 5;
  string task_type = 6;           // study/practice/interview/review
  string phase_goal = 7;
  int32 day_number = 8;
  int32 duration_minutes = 9;
  string priority = 10;           // high/medium/low
}

message CompanionAgentRequest {
  uint64 user_id = 1;
  string message = 2;
  string context_type = 3;
  repeated string recent_topics = 4;
  string username = 5;
  string conversation_state_json = 6; // JSON-serialized ConversationState from previous turn
}

message CompanionAgentResponse {
  string reply = 1;
  string emotion = 2;
  repeated string suggestions = 3;
  string action = 4;
  Live2DDirective live2d_directive = 5;
  repeated SuggestedAction suggested_actions = 6;
  repeated InlineTrigger inline_triggers = 7;
  IntentInfo intent = 8;
  PendingAction pending_action = 9;
  ConversationState conversation_state = 10;
}

// SuggestedAction 结构化引导动作，供前端渲染跳转 chip。
message SuggestedAction {
  string type = 1;    // practice | interview | adjust_plan | chat
  string target = 2;  // 题集编码 / 面试类型 / 空
  string params = 3;  // 额外参数 JSON 字符串
}

// InlineTrigger 字幕行内可点击关键词，前端据此渲染高亮可点 span。
message InlineTrigger {
  string keyword = 1;       // 在 reply 中出现的可点击关键词
  string action_type = 2;   // practice | interview | adjust_plan
  string target = 3;        // 导航目标标识（题集编码等）
  string position_hint = 4; // head | middle | tail
}

// IntentInfo LLM 意图识别结果。
message IntentInfo {
  string type = 1;       // practice | adjust_plan | interview | chat
  double confidence = 2; // 0-1
  string stage = 3;      // collecting_info | ready_to_execute | none
}

// PendingAction 待执行动作，ready=true 时前端自动触发。
message PendingAction {
  string type = 1;                    // adjust_plan | practice 等
  bool ready = 2;                     // 是否可执行
  map<string, string> params = 3;     // 已收集的参数
  repeated string missing_info = 4;   // 还缺哪些信息
}

// ConversationState 多轮对话状态，跨轮次传入保持上下文。
message ConversationState {
  string phase = 1;                       // greeting | collecting | ready | executing
  map<string, string> collected_params = 2; // 已收集参数
}

// GetGreeting 本地欢迎语请求（对齐单体 CompanionAgent.GetGreeting）
message GetGreetingRequest {
  uint64 user_id = 1;
  string level = 2;           // 用户级别：beginner/intermediate/advanced
  string time_of_day = 3;     // 时间段：morning/afternoon/evening/night
}

// GetGreeting 本地欢迎语响应
message GetGreetingResponse {
  string content = 1;
  string emotion = 2;
  string action = 3;
}

// GetEncouragement 本地鼓励语请求（对齐单体 CompanionAgent.GetEncouragement）
message GetEncouragementRequest {
  uint64 user_id = 1;
  string achievement = 2;     // 成就描述
}

// GetEncouragement 本地鼓励语响应
message GetEncouragementResponse {
  string content = 1;
  string emotion = 2;
  string action = 3;
}

message QuizAnalyzerRequest {
  string question = 1;
  string answer = 2;
  string topic = 3;
  string difficulty = 4;
  string question_type = 5;
}

message QuizAnalyzerResponse {
  double score = 1;
  bool is_correct = 2;
  string feedback = 3;
  repeated string key_points = 4;
  string suggestions = 5;
  string correct_answer = 6;
}

// AnalyzeCode 代码分析请求（对齐单体 QuizAnalyzer.AnalyzeCode）
message AnalyzeCodeRequest {
  string code = 1;
  string language = 2;
  string question = 3;
}

// AnalyzeCode 代码分析响应
message AnalyzeCodeResponse {
  bool is_correct = 1;
  double score = 2;
  string feedback = 3;
  repeated string issues = 4;
  repeated string improvements = 5;
  repeated string mistake_tags = 6;
  repeated string strength_tags = 7;
  string time_complexity = 8;
  string space_complexity = 9;
}

// CodingProcessEvent 编程过程事件
message CodingProcessEvent {
  string type = 1;
  int64 timestamp_ms = 2;
  string payload_json = 3;  // JSON 格式的 payload
}

// DiagnoseInterviewCoding 编程面试诊断请求（对齐单体 QuizAnalyzer.DiagnoseInterviewCoding）
message DiagnoseInterviewCodingRequest {
  string question = 1;
  string language = 2;
  string final_code = 3;
  string final_answer = 4;
  repeated CodingProcessEvent process_events = 5;
}

// DiagnoseInterviewCoding 编程面试诊断响应
message DiagnoseInterviewCodingResponse {
  double score = 1;
  repeated string mistake_tags = 2;
  repeated string strength_tags = 3;
  repeated string evidence = 4;
  repeated string suggestions = 5;
  string process_summary = 6;
}

// ExplainAnswer 答案解析请求（对齐单体 QuizAnalyzer.ExplainAnswer）
message ExplainAnswerRequest {
  string question_title = 1;
  string question_content = 2;
  string correct_answer = 3;
}

// ExplainAnswer 答案解析响应
message ExplainAnswerResponse {
  string explanation = 1;
}

// GenerateHint 答题提示请求（对齐单体 QuizAnalyzer.GenerateHint）
message GenerateHintRequest {
  string question_title = 1;
  string question_content = 2;
}

// GenerateHint 答题提示响应
message GenerateHintResponse {
  string hint = 1;
}

message ResumeParserRequest {
  string resume_text = 1;
  string job_description = 2;  // 目标岗位描述，用于分析匹配度
}

message ResumeParserResponse {
  repeated string skills = 1;
  repeated string experience = 2;
  repeated string education = 3;
  repeated string projects = 4;
  string summary = 5;
  repeated string weak_signals = 6;  // 候选人薄弱信号，用于简历驱动面试针对性追问
  repeated string strengths = 7;     // 简历中体现的优势
}

message Live2DDirectiveRequest {
  string context = 1;
  string emotion_hint = 2;
  string reply_text = 3;
}

message Live2DDirectiveResponse {
  string emotion = 1;
  string action = 2;
  string reply = 3;
  string motion_key = 4;
  string motion_group = 5;
  int32 duration_ms = 6;
  string motion_priority = 7;
  int32 motion_duration_ms = 8;
  float intensity = 9;
  float mouth_open = 10;
  string source = 11;
  repeated Live2DDirectiveExpressionLayer expression_mix = 12;
  repeated Live2DDirectiveParameterOverride parameter_overrides = 13;
}

message Live2DDirectiveExpressionLayer {
  string key = 1;
  float weight = 2;
}

message Live2DDirectiveParameterOverride {
  string id = 1;
  float value = 2;
}

// Live2DDirective Live2D 控制指令（对齐单体 ai.Live2DDirective）
message Live2DDirective {
  string emotion = 1;
  string action = 2;
  string reply = 3;
  repeated Live2DDirectiveExpressionLayer expression_mix = 4;
  repeated Live2DDirectiveParameterOverride parameter_overrides = 5;
  string motion_key = 6;
  string motion_group = 7;
  string motion_priority = 8;
  int32 motion_duration_ms = 9;
  float intensity = 10;
  int32 duration_ms = 11;
  float mouth_open = 12;
  string source = 13;
}

// ============================================================
// Admin 调试 RPC 消息
// ============================================================

message RenderPromptRequest {
  string scene = 1;                    // 场景标识，如 interview_agent
  string template_text = 2;           // 模板原文（可选，为空时从DB加载）
  map<string, string> variables = 3;   // 变量键值对
  bool run_with_llm = 4;              // 是否用渲染后的 prompt 调用 LLM
}

message RenderPromptResponse {
  string rendered_prompt = 1;          // 渲染后的 prompt
  map<string, string> resolved_variables = 2; // 解析后的变量明细
  string llm_response = 3;            // LLM 响应（仅 run_with_llm=true 时有值）
  string model = 4;                    // 使用的模型
  int64 latency_ms = 5;               // LLM 调用耗时（仅 run_with_llm=true）
}

message DebugAIRequest {
  string scene = 1;                    // 场景标识
  string prompt = 2;                   // 直接传入 prompt 文本
  map<string, string> params = 3;      // 变量参数
  string model_override = 4;           // 模型覆盖（可选）
}

message DebugAIResponse {
  string rendered_prompt = 1;          // 渲染后的 prompt
  string response = 2;                 // LLM 原始响应
  string model = 3;                    // 使用的模型
  int32 input_tokens = 4;             // 输入 token 数
  int32 output_tokens = 5;            // 输出 token 数
  int64 latency_ms = 6;               // 调用耗时
  string error = 7;                    // 错误信息（如有）
}

message GenerateQuestionCandidatesRequest {
  string industry_code = 1;            // 行业编码
  string requirement = 2;              // 生成需求描述
  int32 candidate_count = 3;           // 候选题数量
  string generation_mode = 4;          // 生成模式
  repeated string sources = 5;         // 数据源
  string agent_prompt = 6;             // 自定义 agent prompt
  bool include_scraped = 7;            // 是否包含爬虫数据
  bool include_generated = 8;          // 是否包含 AI 生成数据
  string industry_name = 9;            // 行业名称（由 Admin Service 查询后传入）
  repeated string categories = 10;     // 分类名称列表
}

message GenerateQuestionCandidatesResponse {
  string industry_code = 1;
  string requirement = 2;
  repeated QuestionCandidate candidates = 3;
  repeated string warnings = 4;
}

message QuestionCandidate {
  string id = 16;
  string title = 1;
  string content = 2;
  string type = 3;
  string difficulty = 4;
  string category = 5;
  string answer = 6;
  string explanation = 7;
  repeated string tags = 8;
  string source_type = 9;
  double confidence = 10;
  string solution = 11;
  string judge_config = 12;
  string source_label = 13;
  string source_title = 14;
  string source_url = 15;
}

// 题目流水线流式事件
message QuestionPipelineStreamEvent {
  string event = 1;           // status | warning | card | complete | error
  string message = 2;         // 消息文本
  string trace_id = 3;        // 追踪ID
  string raw_output = 4;      // 原始输出
  string failure_stage = 5;   // 失败阶段
  string candidate_excerpt = 6;
  bool repair_attempted = 7;
  bool supplement_attempted = 8;
  int32 slot_index = 9;       // 题卡索引
  int32 retry_index = 10;     // 重试索引
  QuestionCandidate card = 11; // 题卡数据
  GenerateQuestionCandidatesResponse response = 12; // 完整响应
}
