
services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: makejob-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: makejob
      RABBITMQ_DEFAULT_PASS: makejob123
      RABBITMQ_DEFAULT_VHOST: /makejob
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  rabbitmq_data:
