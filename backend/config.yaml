# MakeJob Backend Configuration

server:
  port: 8080
  mode: debug  # debug/release

database:
  host: localhost
  port: 5434          # 修改点：对应 Docker 映射的宿主机端口
  user: postgres      # 默认用户名，除非你通过环境变量修改过
  password: password  # 对应你启动命令中的 POSTGRES_PASSWORD
  dbname: makejob
  sslmode: disable

redis:
  host: localhost
  port: 6384          # 修改点：对应 Docker 映射的宿主机端口
  password: ""        # 你启动 Redis 时未设置密码，保持为空
  db: 0
jwt:
  secret: "makejob-secret-key-change-in-production"
  expire: 24  # hours
  refresh_expire: 168  # hours (7 days)

casbin:
  model_path: "config/rbac_model.conf"

ai:
  provider: "eino"           # 可切换为 eino
  fallback_provider: "mock"
  model: ""                  # 留空时可回退到 volcengine.ark.chat_model
  api_key: ""                # 留空时可回退到 volcengine.ark.api_key
  base_url: ""               # 留空时可回退到 volcengine.ark.base_url
  temperature: 0.7
  top_p: 0.9
  max_tokens: 2048
  timeout_seconds: 30
  enable_stream: false
  interview_model: ""
  plan_model: ""
  companion_model: ""
  quiz_model: ""

minimax:
  group_id: "2045005272065249730"               # 必填，按 MiniMax 控制台中的 GroupId 配置
