{{/*
ConfigMap 模板：每个服务一份 config.yaml（K8s Service DNS + ${VAR} 占位敏感字段）
对应 docs/observability-k8s-checklist.md 5.5
*/}}
{{- range $svcName, $cfg := .Values.services }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $.Release.Name }}-{{ $svcName }}-config
  labels:
    {{- include "makejob.labels" $ | nindent 4 }}
    makejob.io/service: {{ $svcName }}
data:
  config.yaml: |
    server:
      grpc:
        addr: "0.0.0.0:{{ $cfg.grpcPort }}"
        timeout: 30s
      {{- if $cfg.httpPort }}
      http:
        addr: "0.0.0.0:{{ $cfg.httpPort }}"
        timeout: 30s
      {{- end }}
    data:
      database:
        driver: postgres
        source: ${DB_SOURCE}
      redis:
        addr: "host.docker.internal:6384"
        password: ""
        db: 1
    {{- if eq $svcName "interview" }}
    ai:
      service_addr: "ai-gateway:9011"
      timeout_ms: 90000
    rag:
      service_addr: "rag:9012"
    archive:
      service_addr: "learning-archive:9010"
    membership:
      service_addr: "membership:9002"
    companion:
      service_addr: "companion:9008"
    code_runner:
      service_addr: "coderunner:9013"
      timeout_ms: 10000
    mq:
      url: ${MQ_URL}
      exchange: "makejob.async"
    jwt:
      secret: ${JWT_SECRET}
      expire_hours: 168
      service_secret: ${JWT_SECRET}
    interview:
      timeout_minutes: 40
    {{- else if eq $svcName "gateway" }}
    services:
      user:
        addr: "makejob-user:9101"
      membership:
        addr: "makejob-membership:9002"
      question:
        addr: "makejob-question:9003"
      interview:
        addr: "makejob-interview:9004"
      realtime:
        addr: "makejob-realtime:8085"
      growth:
        addr: "makejob-growth:9006"
      plan:
        addr: "makejob-plan:9007"
      companion:
        addr: "makejob-companion:9008"
      community:
        addr: "makejob-community:9009"
      admin:
        addr: "makejob-admin:9014"
    jwt:
      secret: ${JWT_SECRET}
    {{- else if eq $svcName "ai-gateway" }}
    jwt:
      secret: ${JWT_SECRET}
    {{- else if eq $svcName "rag" }}
    rag:
      milvus_addr: "host.docker.internal:19530"
      milvus_user: "root"
      milvus_password: "Milvus"
      collection_name: "makejob_questions"
      ark_api_key: "ark-1c544572-9c83-495d-a291-4fe31d71e8d5-91264"
      ark_base_url: "https://ark.cn-beijing.volces.com/api/v3"
      embed_model: "doubao-embedding-large-text-240915"
      top_k: 5
      score_threshold: 0.0
    mq:
      url: ${MQ_URL}
      exchange: "makejob.async"
    jwt:
      secret: ${JWT_SECRET}
    {{- else if eq $svcName "learning-archive" }}
    mq:
      url: ${MQ_URL}
      exchange: "makejob.async"
    jwt:
      secret: ${JWT_SECRET}
    {{- else if eq $svcName "question" }}
    ai:
      service_addr: "ai-gateway:9011"
      coderunner_addr: "coderunner:9013"
      ai_gateway_addr: "ai-gateway:9011"
      rag_addr: "rag:9012"
      admin_addr: "admin:9014"
    dependent_services:
      learning_archive_addr: "learning-archive:9010"
    mq:
      url: ${MQ_URL}
      exchange: "makejob.async"
    jwt:
      secret: ${JWT_SECRET}
    {{- else if eq $svcName "plan" }}
    ai:
      service_addr: "ai-gateway:9011"
    dependent_services:
      learning_archive_addr: "learning-archive:9010"
    mq:
      url: ${MQ_URL}
      exchange: "makejob.async"
    jwt:
      secret: ${JWT_SECRET}
    {{- else if eq $svcName "companion" }}
    ai:
      service_addr: "ai-gateway:9011"
    growth:
      service_addr: "growth:9006"
    interview:
      service_addr: "interview:9004"
    plan:
      service_addr: "plan:9007"
    jwt:
      secret: ${JWT_SECRET}
    {{- else if eq $svcName "growth" }}
    dependent_services:
      question_addr: "question:9003"
      plan_addr: "plan:9007"
      learning_archive_addr: "learning-archive:9010"
      interview_addr: "interview:9004"
    jwt:
      secret: ${JWT_SECRET}
    {{- else if eq $svcName "admin" }}
    mq:
      url: ${MQ_URL}
      exchange: "makejob.async"
    dependent_services:
      user_addr: "user:9101"
      question_addr: "question:9003"
      interview_addr: "interview:9004"
      ai_gateway_addr: "ai-gateway:9011"
      rag_addr: "rag:9012"
    jwt:
      secret: ${JWT_SECRET}
    {{- else if eq $svcName "user" }}
    jwt:
      secret: ${JWT_SECRET}
    {{- else if eq $svcName "membership" }}
    jwt:
      secret: ${JWT_SECRET}
    {{- else if eq $svcName "realtime" }}
    jwt:
      secret: ${JWT_SECRET}
    {{- else if eq $svcName "community" }}
    jwt:
      secret: ${JWT_SECRET}
    {{- end }}
    telemetry:
      otlp_endpoint: "collector:4317"
      service_name: "makejob.{{ $svcName }}"
      sample_ratio: 1.0
      http_port: 6060
{{- end }}
