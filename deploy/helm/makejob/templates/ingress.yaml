{{/*
单 Ingress：/api/v1(含 WS) -> gateway, /live2d-assets -> gateway, / -> frontend
对应 docs/observability-k8s-checklist.md 5.4
*/}}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ingress
  labels:
    {{- include "makejob.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    # WebSocket 支持（实时语音面试 /interviews/*/ws）
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host | default "localhost" }}
      http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-gateway
                port:
                  number: 8082
          - path: /live2d-assets
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-gateway
                port:
                  number: 8082
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-frontend
                port:
                  number: 80
  {{- if .Values.observability.enabled }}
  # 可观测性工具子域名路由：*.localhost 由浏览器自动解析到本机（127.0.0.1），
  # 让 Prometheus/Jaeger/Grafana 以根路径渲染，避免子路径导致前端静态资源 404。
  # 访问示例：http://prometheus.localhost:8080 / http://jaeger.localhost:8080 / http://grafana.localhost:8080
    - host: prometheus.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-prometheus
                port:
                  number: 9090
    - host: jaeger.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-jaeger
                port:
                  number: 16686
    - host: grafana.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-grafana
                port:
                  number: 3000
  {{- end }}
{{- end }}
