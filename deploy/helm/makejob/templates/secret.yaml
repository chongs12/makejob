{{/*
Secret 模板：敏感配置（DB source/JWT secret/Ark API key/MQ URL）
对应 docs/observability-k8s-checklist.md 5.5
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret
  labels:
    {{- include "makejob.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_SOURCE: {{ .Values.global.secretEnv.DB_SOURCE | quote }}
  JWT_SECRET: {{ .Values.global.secretEnv.JWT_SECRET | quote }}
  ARK_API_KEY: {{ .Values.global.secretEnv.ARK_API_KEY | default "" | quote }}
  MQ_URL: {{ .Values.global.secretEnv.MQ_URL | quote }}
