# Grafana: Deployment + ConfigMap(datasources + dashboards) + Service
# 对应 docs/observability-k8s-checklist.md 5.7
apiVersion: v1
kind: ConfigMap
metadata:
  name: makejob-grafana-datasources
  labels:
    app.kubernetes.io/name: grafana
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      # 固定 uid，供 dashboard JSON 稳定引用（避免 Grafana 重启后 uid 变化导致面板断连）
      - name: Prometheus
        uid: prometheus
        type: prometheus
        url: http://makejob-prometheus:9090
        access: proxy
        isDefault: true
      - name: Jaeger
        uid: jaeger
        type: jaeger
        url: http://makejob-jaeger:16686
        access: proxy
---
# Dashboard 供应商配置：从 /var/lib/grafana/dashboards 目录自动加载
apiVersion: v1
kind: ConfigMap
metadata:
  name: makejob-grafana-dashboards-provider
  labels:
    app.kubernetes.io/name: grafana
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: makejob
        orgId: 1
        folder: 'MakeJob'
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/dashboards
---
# Dashboard JSON：使用真实存在的业务/基础指标，配合录制演示
apiVersion: v1
kind: ConfigMap
metadata:
  name: makejob-grafana-dashboards
  labels:
    app.kubernetes.io/name: grafana
data:
  makejob-overview.json: |-
{{ .Files.Get "files/makejob-overview.json" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: makejob-grafana
  labels:
    app.kubernetes.io/name: grafana
spec:
  replicas: {{ .Values.grafana.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
    spec:
      containers:
        - name: grafana
          image: {{ .Values.grafana.image }}
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: {{ .Values.grafana.adminUser | quote }}
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: {{ .Values.grafana.adminPassword | quote }}
          ports:
            - name: web
              containerPort: 3000
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: dashboards-provider
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
          resources:
            {{- toYaml .Values.grafana.resources | nindent 12 }}
      volumes:
        - name: datasources
          configMap:
            name: makejob-grafana-datasources
        - name: dashboards-provider
          configMap:
            name: makejob-grafana-dashboards-provider
        - name: dashboards
          configMap:
            name: makejob-grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: makejob-grafana
  labels:
    app.kubernetes.io/name: grafana
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: web
      port: 3000
      targetPort: 3000
      nodePort: 30000
