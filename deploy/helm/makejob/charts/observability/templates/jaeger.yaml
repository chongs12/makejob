# Jaeger: Deployment + Service
# 对应 docs/observability-k8s-checklist.md 5.7
apiVersion: apps/v1
kind: Deployment
metadata:
  name: makejob-jaeger
  labels:
    app.kubernetes.io/name: jaeger
spec:
  replicas: {{ .Values.jaeger.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: jaeger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jaeger
    spec:
      containers:
        - name: jaeger
          image: {{ .Values.jaeger.image }}
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
          ports:
            - name: ui
              containerPort: 16686
            - name: otlp
              containerPort: 4317
          resources:
            {{- toYaml .Values.jaeger.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: makejob-jaeger
  labels:
    app.kubernetes.io/name: jaeger
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: jaeger
  ports:
    - name: ui
      port: 16686
      targetPort: 16686
      nodePort: 30086
    - name: otlp
      port: 4317
      targetPort: 4317
