# MakeJob 前端 nginx 配置
# 静态资源 + 反代 gateway（/api/v1 含 WebSocket、/live2d-assets）
# 对应 docs/observability-k8s-checklist.md 4.3

server {
    listen 80;
    server_name _;

    # 静态资源（React SPA，history 模式 fallback）
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # /api/v1 反代 gateway（含 WebSocket 升级，用于实时语音面试 /interviews/*/ws）
    location /api/v1 {
        proxy_pass http://makejob-gateway:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;  # WS 长连接保持
        proxy_send_timeout 3600s;
    }

    # /live2d-assets 反代 gateway（Live2D 模型静态资源）
    location /live2d-assets {
        proxy_pass http://makejob-gateway:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
